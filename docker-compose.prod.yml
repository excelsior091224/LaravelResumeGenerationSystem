services:
  app:
    build:
      context: .
      dockerfile: docker/php-apache/Dockerfile.prod
    container_name: resumefoundries-app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "80:80"
    env_file:
      - ./src/.env.production
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://resumefoundries.com
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - app-storage:/var/www/html/storage
      - app-bootstrap:/var/www/html/bootstrap/cache
      - app-database:/var/www/html/database
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  app-storage:
  app-bootstrap:
  app-database:
