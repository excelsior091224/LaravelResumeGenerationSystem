<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /workspaces/LaravelResumeGenerationSystem/src/public

    <Directory /workspaces/LaravelResumeGenerationSystem/src/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
